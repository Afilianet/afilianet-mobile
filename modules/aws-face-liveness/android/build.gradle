apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
  namespace "expo.modules.awsfaceliveness"
  defaultConfig {
    // com.amplifyframework.ui:liveness's own stated minimum (Android API
    // level 24 / Android 7.0) -- confirmed directly from
    // ui.docs.amplify.aws/android/connected-components/liveness, not
    // assumed. The EFFECTIVE app-wide minSdkVersion is whichever is higher
    // between this and whatever Expo SDK 57 / React Native 0.86 already
    // requires (not independently re-verified here).
    minSdkVersion 24
  }
  buildFeatures {
    compose true
  }
  composeOptions {
    // Kotlin 2.1.20 ships its own Compose compiler plugin (K2) -- no
    // separate composeCompilerExtensionVersion pin needed the way older
    // Kotlin/Compose combinations required. Verify against whatever Kotlin
    // version Expo SDK 57's own template currently pins; adjust this
    // module's Kotlin version to match rather than the reverse if they
    // differ, since the app-wide Kotlin version is not owned by this
    // module.
  }
  // com.amplifyframework.ui:liveness pulls in java.time-using code paths
  // that require desugaring on minSdkVersion < 26.
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'

  // The OFFICIAL AWS Amplify UI Face Liveness Android library -- confirmed
  // Maven coordinates and minSdkVersion directly from
  // ui.docs.amplify.aws/android/connected-components/liveness, not
  // assumed. Deliberately NOT depending on
  // 'com.amplifyframework:aws-auth-cognito' here: this module never calls
  // Amplify.configure() or touches Cognito at all (see
  // AwsFaceLivenessView.kt's custom AWSCredentialsProvider, backed
  // entirely by afilianet-api's own STS broker) -- if a real build turns
  // out to need it transitively as a compile-time dependency of the
  // `liveness` artifact itself (unconfirmed either way from documentation
  // alone), add it back here, but never call Amplify.configure() with a
  // Cognito plugin as a result.
  implementation 'com.amplifyframework.ui:liveness:1.5.0'
  implementation 'androidx.compose.material3:material3:1.2.1'
  implementation platform('androidx.compose:compose-bom:2024.09.00')
}
